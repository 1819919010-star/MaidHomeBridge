plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version
base.archivesName = "maidhome-bridge-${minecraft_version}-neoforge"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
    mods { maidhome_bridge { sourceSet sourceSets.main } }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs/optional', include: ['*.jar'])
    if (project.hasProperty('withMineToMesh')) {
        runtimeOnly fileTree(dir: 'libs/optional', include: ['*.jar'])
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaExec).configureEach { standardInput = System.in }
jar { manifest { attributes 'Implementation-Version': project.version, 'Implementation-Vendor': 'JumDa5he' } }
